{% extends 'base.html' %}
{% block title %}Novo Status de Atendimento{% endblock %}
{% block content %}
<h2>Novo Status/h2>
<form method="post">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" style="text-transform: uppercase;" required>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('main.listar_status_atendimentos') }}" class="btn btn-secondary">Voltar</a>
</form>
{% endblock %}
