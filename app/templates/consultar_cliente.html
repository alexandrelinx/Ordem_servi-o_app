{% extends 'base.html' %}
{% block title %}Consultar Clientes{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>Consultar Clientes</h3>
    <a href="{{ url_for('main.novo_cliente') }}" class="btn btn-primary mb-3">Novo Cliente</a>
    <table class="table table-bordered" id="tabelaClientes">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th class="text-center">Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.id }}</td>
                <td>{{ cliente.nome }}</td>
                <td style="text-align: center;">
                    <a href="{{ url_for('main.editar_cliente', id=cliente.id) }}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{{ url_for('main.excluir_cliente', id=cliente.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir?');">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- DataTables -->
<script>
    $(document).ready(function() {
        $('#tabelaClientes').DataTable({
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
            }
        });
    });
</script>
{% endblock %}
